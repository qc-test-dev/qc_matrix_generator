{% extends 'base.html' %}
{% load static %}

{% block title %}Detalles RN - {{ super_matriz.nombre }}{% endblock %}

{% block content %}
<div class="form-modern-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3 p-md-4 p-lg-5">
    <div class="form-modern-container w-100" style="max-width: 500px;">
        <div class="modern-card bg-white">
            <!-- Header -->
            <div class="modern-card-header text-center p-4 p-md-5 border-bottom">
                <h3 class="modern-title h4 fw-bold text-white mb-2">Detalles RN</h3>
                <p class="modern-subtitle text-white mb-0">{{ super_matriz.nombre }}</p>
            </div>
            
            <!-- Body -->
            <div class="modern-card-body p-4 p-md-5">
                <form method="post" class="modern-form">
                    {% csrf_token %}
                    
                    <!-- Campo Filtro RN -->
                    <div class="input-group-modern mb-4">
                        <div class="input-header d-flex align-items-center mb-2">
                            <i class="fas fa-filter input-icon text-success me-2"></i>
                            <label for="id_filtro_RN" class="input-label fw-semibold text-dark">Filtro RN</label>
                        </div>
                        {{ form.filtro_RN }}
                    </div>

                    <!-- Campo Comentario RN -->
                    <div class="input-group-modern mb-4">
                        <div class="input-header d-flex align-items-center mb-2">
                            <i class="fas fa-comment input-icon text-success me-2"></i>
                            <label for="id_comentario_RN" class="input-label fw-semibold text-dark">Comentario RN</label>
                        </div>
                        {{ form.comentario_RN }}
                    </div>

                    <!-- Campo Testers -->
                    <div class="input-group-modern mb-4">
                        <div class="input-header d-flex align-items-center mb-2">
                            <i class="fas fa-users input-icon text-success me-2"></i>
                            <label class="input-label fw-semibold text-dark">Selecciona testers</label>
                        </div>
                        {{ form.testers }}
                    </div>

                    <!-- Botón de envío -->
                    <div class="form-actions mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold">
                            <i class="fas fa-save me-2"></i>
                            Guardar y continuar
                            <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
