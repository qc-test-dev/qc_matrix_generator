upstream django_asgi {
    server app:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 200.57.172.7;

    # Archivos estáticos
    location /static/ {
        alias /vol/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket - Configuración específica y robusta
    location /ws/ {
        proxy_pass http://django_asgi;
        proxy_http_version 1.1;
        
        # Headers esenciales para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts apropiados para WebSocket
        proxy_connect_timeout 4s;
        proxy_send_timeout 12s;
        proxy_read_timeout 12s;
        
        # Desactivar buffering para tiempo real
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        
        # Headers adicionales para WebSocket
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        
        # Ocultar headers problemáticos
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
    }

    # HTTP normal
    location / {
        proxy_pass http://django_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts normales para HTTP
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Ocultar headers problemáticos
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
    }
}