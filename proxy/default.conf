upstream django_asgi {
    server app:8000;
}

server {
    listen 80;
    server_name 200.57.172.7;

    # Remover completamente headers COOP problemáticos
    more_clear_headers "Cross-Origin-Opener-Policy";
    more_clear_headers "Cross-Origin-Embedder-Policy";
    
    # Si more_clear_headers no está disponible, usar proxy_hide_header
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;

    # 1. Archivos estáticos
    location /static/ {
        alias /vol/static/;
    }

    # 2. WebSocket (Channels)
    location /ws/ {
        proxy_pass             http://django_asgi;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400;
        proxy_send_timeout     86400;
        
        # Ocultar headers problemáticos también en WebSocket
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
    }

    # 3. HTTP normal
    location / {
        proxy_pass             http://django_asgi;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        
        # Ocultar headers problemáticos
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
    }
}