version: '3.9'

networks:
  qc_network:
    driver: bridge

volumes:
  postgres_data:
  staticfiles-volume:

services:

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - qc_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: qc_admin
      POSTGRES_PASSWORD: qc_admin_pass
      POSTGRES_DB: qc_matrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc_admin -d qc_matrix"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    volumes:
      - ./:/app
      - staticfiles-volume:/vol/static
    environment:
      - DJANGO_SETTINGS_MODULE=main_website.settings.prod
      - DEBUG=0
      - POSTGRES_DB=qc_matrix
      - POSTGRES_USER=qc_admin
      - POSTGRES_PASSWORD=qc_admin_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Comando dividido en dos fases: setup inicial y servidor
    command: >
      sh -c "
        echo 'Esperando servicios...' &&
        sleep 10 &&
        echo 'Ejecutando setup inicial...' &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput --clear &&
        if [ -f /app/initialdata.json ]; then
          echo 'Cargando datos iniciales...' &&
          python manage.py loaddata /app/initialdata.json --ignorenonexistent --exclude contenttypes --exclude auth.permission;
        fi &&
        echo 'Iniciando servidor Daphne...' &&
        
      "
    networks:
      - qc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/", "||", "exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - staticfiles-volume:/vol/static
    depends_on:
      - app
    networks:
      - qc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/", "||", "exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3