version: '3.9'

networks:
  qc_network:
    driver: bridge

volumes:
  postgres_data:
  staticfiles-volume:

services:
  redis:
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - qc_network

  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: qc_admin
      POSTGRES_PASSWORD: qc_admin_pass
      POSTGRES_DB: qc_matrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qc_network

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8180:8180"
    volumes:
      - ./:/app
      - staticfiles-volume:/vol/static
    environment:
      - WEBSOCKET_URL=/ws/
      - DAPHNE_PORT=8180
      - DJANGO_SETTINGS_MODULE=main_website.settings.prod
      - DEBUG=0
      - POSTGRES_DB=qc_matrix
      - POSTGRES_USER=qc_admin
      - POSTGRES_PASSWORD=qc_admin_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHANNEL_LAYER_REDIS_URL=redis://redis:6379/0
      # Otros variables que uses
    depends_on:
      - db
      - redis
      
    networks:
      - qc_network

  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - staticfiles-volume:/vol/static
    depends_on:
      - app
    networks:
      - qc_network
