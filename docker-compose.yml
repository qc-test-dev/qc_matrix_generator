version: '3.9'

networks:
  qc_network:
    driver: bridge

volumes:
  postgres_data:
  staticfiles-volume:

services:

  redis:
    image: redis:6-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - qc_network

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: qc_admin
      POSTGRES_PASSWORD: qc_admin_pass
      POSTGRES_DB: qc_matrix
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qc_network

  app:
    build:
      context: .
    volumes:
      - ./:/app
      - staticfiles-volume:/vol/static
    environment:
      - DJANGO_SETTINGS_MODULE=main_website.settings.uat
      - DEBUG=0
      - POSTGRES_DB=qc_matrix
      - POSTGRES_USER=qc_admin
      - POSTGRES_PASSWORD=qc_admin_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5433
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
    depends_on:
      - db
      - redis
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput --clear &&
        if [ -f /app/initialdata.json ]; then
          python manage.py loaddata /app/initialdata.json --ignorenonexistent --exclude contenttypes --exclude auth.permission;
        fi &&
        exec daphne -b 0.0.0.0 -p 8000 main_website.asgi:application
      "
    networks:
      - qc_network

  proxy:
    build:
      context: ./proxy_uat
    ports:
      - "8080:8080"
    volumes:
      - staticfiles-volume:/vol/static
    depends_on:
      - app
    networks:
      - qc_network
