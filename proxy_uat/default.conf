map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream django_asgi {
    server app:8000;
}

# ==================== NUEVO: Upstream para Streamlit ====================
upstream streamlit_backend {
    server streamlit_chat:8501;
}
# ========================================================================

server {
    listen 8080;
    server_name 200.57.172.7;

    proxy_set_header Accept-Encoding "";
    sub_filter_types text/html;
    sub_filter_once off;
    client_max_body_size 100M;  # ← Agregado para subir PDFs grandes

    # ==================== NUEVO: Auth verification ====================
    location /auth/verify {
        internal;
        proxy_pass http://django_asgi/api/verify-session/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location @error401 {
        return 302 /accounts/login/?next=$request_uri;
    }
    # ==================================================================

    #  Archivos estáticos de Django
    location /static/ {
        alias /vol/static/;
    }

    #  WebSocket para Django
    location /ws/ {
        proxy_pass http://django_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ==================== NUEVO: Streamlit Chat QC (PROTEGIDO) ====================
    location ^~ /chat_qc/ {
        #auth_request /auth/verify;  # ← PROTECCIÓN: solo usuarios logueados
        #error_page 401 = @error401;
        
        proxy_pass http://streamlit_backend/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;  # ← Importante para mantener sesión
        
        # WebSocket para Streamlit
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Timeouts largos para streaming
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_buffering off;
    }

    # Assets de Streamlit (también protegidos)
    location ~ ^/chat_qc/(_stcore|static|healthz|vendor) {
        #auth_request /auth/verify;
        #error_page 401 = @error401;
        
        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    # ==============================================================================

     #Jenkins (asegura que /jenkins/ se atienda antes que /)
    #location ^~ /jenkins/ {
     #   proxy_pass http://jenkins:8080/jenkins/;
      #  proxy_set_header Host $host;
       # proxy_set_header X-Real-IP $remote_addr;
        #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #proxy_set_header X-Forwarded-Proto $scheme;
        #proxy_set_header X-Forwarded-Prefix /jenkins;

        #sub_filter 'href="/' 'href="/jenkins/';
        #sub_filter 'src="/' 'src="/jenkins/';
   # }

      #Catch-all Django app
    location / {
        proxy_pass http://django_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
