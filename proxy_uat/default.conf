map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream django_asgi {
    server app:8000;
}

server {
    listen 8080;
    server_name 200.57.172.7;

    proxy_set_header Accept-Encoding "";
    sub_filter_types text/html;
    sub_filter_once off;

    # 📁 Archivos estáticos de Django
    location /static/ {
        alias /vol/static/;
    }

    # 🔌 WebSocket para Django
    location /ws/ {
        proxy_pass http://django_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ⚙️ Jenkins (asegura que /jenkins/ se atienda antes que /)
    location ^~ /jenkins/ {
        proxy_pass http://jenkins:8080/jenkins/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /jenkins;

        sub_filter 'href="/' 'href="/jenkins/';
        sub_filter 'src="/' 'src="/jenkins/';
    }

    # 🔚 Catch-all Django app
    location / {
        proxy_pass http://django_asgi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
